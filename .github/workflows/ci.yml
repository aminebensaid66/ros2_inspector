name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: mypy
        run: mypy ros2inspector

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -m "not requires_ros2"

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check --strict dist/*
      - name: Upload built distributions
        uses: actions/upload-artifact@v7
        with:
          name: ci-python-distributions
          path: dist/
          if-no-files-found: error

  wheel-smoke:
    name: Wheel smoke (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: ci-python-distributions
          path: dist/
      - name: Install built wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheel=glob.glob('dist/ros2inspector-*.whl')[0];
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheel])"
      - name: Smoke-test CLI outside source tree
        run: >-
          python -c "import subprocess;
          subprocess.check_call(['ros2inspector', '--version']);
          subprocess.check_call(['ros2inspector', '--help'])"

  ros2-runtime:
    name: ROS 2 static/runtime differential
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
    steps:
      - uses: actions/checkout@v5
      - name: Install ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Create test environment
        run: |
          apt-get update
          apt-get install -y python3-venv
          python3 -m venv --system-site-packages /tmp/ros2inspector-venv
          /tmp/ros2inspector-venv/bin/python -m pip install -e ".[dev]"
      - name: Compare static findings with live ROS graph
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          /tmp/ros2inspector-venv/bin/python -m pytest \
            -m requires_ros2 tests/integration/test_ros2_differential.py --no-cov
