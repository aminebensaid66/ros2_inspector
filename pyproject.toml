[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ros2inspector"
version = "0.1.0"
description = "Static ROS 2 architecture analysis, visualization, and policy checking"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amine Bensaid", email = "aminebensaid66@gmail.com" }]
keywords = ["ros2", "robotics", "architecture", "static-analysis", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "networkx>=3.3,<3.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "orjson>=3.10",
    "tree-sitter>=0.22",
    "tree-sitter-cpp>=0.22",
    "diskcache>=5.6",
]

[project.urls]
Homepage = "https://github.com/aminebensaid66/ros2_inspector"
Documentation = "https://github.com/aminebensaid66/ros2_inspector_website"
Repository = "https://github.com/aminebensaid66/ros2_inspector"
Issues = "https://github.com/aminebensaid66/ros2_inspector/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
ros2inspector = "ros2inspector.cli.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["ros2inspector*"]

[tool.setuptools.package-data]
"ros2inspector.viz" = ["_cytoscape.min.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_ros2: marks tests that need a live ROS 2 environment",
    "integration: marks portable full-pipeline integration tests",
]
addopts = "--cov=ros2inspector --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# This file embeds HTML/CSS/JS templates where long lines are unavoidable.
"ros2inspector/viz/renderer.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]
